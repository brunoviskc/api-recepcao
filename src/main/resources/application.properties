spring.application.name=api-recepcao

# ===============================
# CONFIGURAÇÕES DE FUSO HORÁRIO
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ===============================
# BANCO DE DADOS POSTGRESQL
# ===============================
# O caminho de conexão na sua máquina local apontando para o banco recepcaodb
#spring.datasource.url=jdbc:postgresql://localhost:5432/recepcaodb
#busca nome computador o endereço do banco de dados que está fora do container docker
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/recepcaodb
spring.datasource.driver-class-name=org.postgresql.Driver

# Substitua pela SUA senha do PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=root

# ===============================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===============================
# Dizemos ao Hibernate para traduzir os comandos para o sotaque do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O ddl-auto=update faz o Java criar a tabela se ela não existir
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# PAINEL DO H2 (DESATIVADO)
# ===============================
# Como não estamos mais usando o H2, podemos desligar o painel visual dele
spring.h2.console.enabled=false